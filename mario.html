<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Super Mario World</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#0b0916;font-family:Consolas,"Courier New",monospace}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#312b4b 0,#141124 54%,#090711 100%)}main{display:flex;flex-direction:column;gap:8px;align-items:center}#frame{width:512px;aspect-ratio:8/7;background:#000;border-radius:2px;box-shadow:0 0 0 3px #171225,0 0 0 6px #635884,0 16px 54px #000b;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}#help{color:#bdb5d0;text-align:center;font-size:11px;text-shadow:1px 1px #000}kbd{padding:1px 4px;border:1px solid #776c99;border-radius:2px;color:#fff;background:#25203c;font:inherit}@media(max-width:560px){#frame{width:256px}#help{font-size:8px}}
</style></head><body><main><div id="frame"><canvas id="game" width="256" height="224" tabindex="0" aria-label="Game canvas"></canvas></div><div id="help"><kbd>&larr;&rarr;</kbd> move &middot; <kbd>&darr;</kbd> crouch/slide &middot; <kbd>&uarr;</kbd> climb &middot; <kbd>X/Y</kbd> run &middot; <kbd>B</kbd> jump &middot; <kbd>A</kbd> spin &middot; <kbd>Shift</kbd> reserve &middot; <kbd>Enter</kbd> pause &middot; <kbd>F2</kbd> power &middot; <kbd>F5</kbd> star &middot; <kbd>F6</kbd> balloon &middot; <kbd>F3</kbd> debug</div></main>
<script>
"use strict";
// ============================================================================
// Super Mario World — faithful recreation (M4: blocks, items & objects)
// Sections: constants/helpers -> RNG -> input -> audio stub -> save -> modes ->
//            level data -> collision -> player -> objects -> update -> render ->
//            loop -> debug API
// ============================================================================

// --- Constants & helpers -----------------------------------------------------
const canvas = document.querySelector("#game"), ctx = canvas.getContext("2d");
const W = 256, H = 224, T = 16, STEP = 1 / 60;          // 256x224 logical, 16px tiles, 60 Hz
ctx.imageSmoothingEnabled = false;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const approach = (v, t, n) => v < t ? Math.min(t, v + n) : Math.max(t, v - n);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// --- SMW physics constants (subpixels/frame; 1 px = 16 subpx) -----------------
const SUB = 16;
const WALK_MAX = 16, RUN_MAX = 36, SPRINT_MAX = 48;                 // $10/$24/$30
const WALK_ACCEL = 1, RUN_ACCEL = 2;                                // ground accel
const WALK_DECEL = 2, RUN_DECEL = 3, SKID_DECEL = 4;                // ground decel / turn
const AIR_ACCEL_WALK = 1, AIR_ACCEL_RUN = 2;                        // air accel (no air friction)
const GRAV_HOLD = 3, GRAV_RELEASE = 6, MAX_FALL = 64;               // $03/$06/$40
const P_MAX = 112, P_RUN_SPEED = 35, SLIDE_MAX = 40;                // P-meter $70
const OSC = [0, -1, 0, -1, 1];                                      // run/sprint max oscillation (5-frame)
const JUMP_SPEED = [-80, -74, -82, -76, -85, -78, -87, -80, -90, -82, -92, -85, -95, -87, -97, -90]; // DATA_00D2BD

// --- M3: flight / swim / climb / power-up constants -----------------------------
const FLY_SPEED = 51, FLY_DIVE_SPEED = 64, FLY_RISE = -32, FLY_GLIDE_FALL = 4, FLY_DIVE_FALL = 24;
const SLOW_FALL = 2, SPIN_GRAV = 3;                                 // cape slow-fall, spin jump fixed gravity
const SWIM_STROKE = -32, SWIM_MAX_FALL = 16, SWIM_MAX_X = 24;       // swim physics
const CLIMB_SPEED = 16;                                             // vine/net climb px/tick
const STAR_TICKS = 600, BALLOON_TICKS = 480, BALLOON_RISE = -8;     // star invincibility, P-balloon
const POWER_ORDER = ["small", "super", "fire", "cape"];

// --- M4: blocks / items / objects constants -------------------------------------
const COIN_SCORE = 100, DRAGON_SCORE = 1000, DRAGON_TOTAL = 5;      // coin & dragon coin scoring
const SHELL_SPEED = 48, SHELL_MIN = 12, KEY_THROW_VX = 56, KEY_THROW_VY = -48;
const P_SWITCH_TICKS = 128, BLOCK_BUMP = 8;                         // P-switch duration, block bump anim

// --- Seeded PRNG (deterministic; gameplay must use rng(), never Math.random) --
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(0xC0FFEE);
function reseed(seed) { rng = mulberry32(seed >>> 0); }

// --- Input: authentic SNES-style mapping --------------------------------------
//   D-pad = arrow keys · X/Y = run/action · B = jump · A = spin jump
//   Select (Shift) = reserve item · Start (Enter) = pause · L/R (Q/E) = look
const KEY = {
  LEFT: ["ArrowLeft"], RIGHT: ["ArrowRight"], UP: ["ArrowUp"], DOWN: ["ArrowDown"],
  RUN: ["KeyX", "KeyY"], JUMP: ["KeyB"], SPIN: ["KeyA"],
  RESERVE: ["ShiftLeft", "ShiftRight"], START: ["Enter"], LOOK_L: ["KeyQ"], LOOK_R: ["KeyE"]
};
const input = {
  down: new Set(), pressed: new Set(), released: new Set(),
  held(...c) { return c.some(k => this.down.has(k)); },
  hit(...c) { return c.some(k => this.pressed.has(k)); },
  edges() { this.pressed.clear(); this.released.clear(); },
  reset() { this.down.clear(); this.edges(); }
};
addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space"].includes(e.code)) e.preventDefault();
  if (!input.down.has(e.code)) input.pressed.add(e.code);
  input.down.add(e.code);
  audio.unlock();
});
addEventListener("keyup", e => { input.down.delete(e.code); input.released.add(e.code); });
addEventListener("blur", () => input.reset());
document.addEventListener("visibilitychange", () => { if (document.hidden) input.reset(); });
canvas.addEventListener("pointerdown", () => canvas.focus());
canvas.focus();

// --- Audio stub (real procedural audio arrives in M16) ------------------------
const audio = { ac: null, unlock() {}, tone() {} };

// --- Save: versioned localStorage --------------------------------------------
const SAVE_KEY = "smw-save", SAVE_VERSION = 1;
function freshSave() { return { version: SAVE_VERSION, lives: 5, coins: 0, score: 0 }; }
function loadSave() {
  try {
    const v = JSON.parse(localStorage.getItem(SAVE_KEY));
    return v && v.version === SAVE_VERSION && Number.isFinite(v.lives) ? Object.assign(freshSave(), v) : freshSave();
  } catch { return freshSave(); }
}
function store() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(game.save)); } catch {} }

// --- Game state + explicit mode machine ---------------------------------------
const game = {
  mode: "title", prevMode: null, tick: 0,
  save: loadSave(),
  level: null, player: null,
  camX: 0, message: "", messageTick: 0,
  transition: 0, deathTick: 0, timer: 300, debug: true,
  objects: [], pswitch: 0, pswap: null, dragon: 0, secret: false
};
const MODES = ["title", "map", "level", "pause", "death", "clear", "gameover", "ending"];
const ENTER = {
  title() { game.level = null; game.player = null; },
  map() { game.level = null; game.player = null; },
  level() {},
  pause() {},
  death() { game.deathTick = 0; },
  gameover() { game.deathTick = 0; },
  clear() { game.deathTick = 0; },
  ending() {}
};
function setMode(m) {
  if (game.mode !== m) { game.prevMode = game.mode; game.mode = m; (ENTER[m] || (() => {}))(); }
}
function show(s, t = 120) { game.message = s; game.messageTick = t; }

// --- Level data (data-driven; M8 replaces the stub with real courses) ---------
function makeTestLevel() {
  const w = 96, h = 14, tiles = new Map();
  const put = (x, y, t = "G") => tiles.set(x + "," + y, t);
  const ground = (x0, x1, y = 12) => { for (let x = x0; x <= x1; x++) for (let r = y; r < h; r++) put(x, r, "G"); };
  ground(0, 95);                                                  // long flat run-up for measurements
  put(48, 11, "B"); put(49, 11, "B"); put(50, 11, "B");         // step
  put(52, 10, "Q"); put(53, 10, "B"); put(54, 10, "B");         // overhead blocks
  for (let i = 0; i < 4; i++) put(60 + i, 11 - i, "/");          // hill up
  for (let i = 0; i < 4; i++) put(64 + i, 8 + i, "\\");          // hill down
  for (let i = 0; i < 4; i++) put(74 + i, 11 - i, "/");          // second hill up
  for (let i = 0; i < 4; i++) put(78 + i, 8 + i, "\\");          // second hill down
  put(86, 11, "B"); put(87, 11, "B"); put(88, 11, "B"); put(89, 11, "B"); put(90, 11, "B");
  return { id: "test", name: "PHYSICS TEST ROOM", w, h, tiles, spawn: { x: 2, y: 176 } };
}

// M3 lab: water pool, vine, net/fence, turn blocks, slopes, runway
function makeM3Level() {
  const w = 96, h = 14, tiles = new Map();
  const put = (x, y, t = "G") => tiles.set(x + "," + y, t);
  const ground = (x0, x1, y = 12) => { for (let x = x0; x <= x1; x++) for (let r = y; r < h; r++) put(x, r, "G"); };
  ground(0, 28);                                                   // start runway
  for (let i = 0; i < 3; i++) put(30 + i, 11 - i, "/");           // hill up
  for (let i = 0; i < 3; i++) put(33 + i, 9 + i, "\\");           // hill down
  ground(36, 40);
  for (let x = 41; x <= 54; x++) { put(x, 12, "G"); put(x, 11, "W"); put(x, 10, "W"); } // water pool
  ground(55, 96);
  put(60, 11, "T"); put(61, 11, "T"); put(62, 11, "T"); put(63, 11, "T"); // turn-block step (spin-breakable)
  put(66, 9, "T"); put(67, 9, "T"); put(68, 9, "T"); put(69, 9, "T"); // overhead turn blocks
  for (let r = 2; r <= 9; r++) put(74, r, "V");                   // vine, rows 2..9
  for (let x = 80; x <= 83; x++) for (let r = 3; r <= 11; r++) put(x, r, "N"); // net/fence
  return { id: "m3", name: "M3 MOVES LAB", w, h, tiles, spawn: { x: 2, y: 176 } };
}

// M4 lab: ? contents, bricks, turn blocks, coins, dragon coins, P-switch, shell, key/keyhole
function makeM4Level() {
  const w = 128, h = 14, tiles = new Map(), contents = new Map();
  const put = (x, y, t = "G") => tiles.set(x + "," + y, t);
  const ground = (x0, x1, y = 12) => { for (let x = x0; x <= x1; x++) for (let r = y; r < h; r++) put(x, r, "G"); };
  const q = (x, y, item) => { put(x, y, "Q"); contents.set(x + "," + y, item); };
  ground(0, 40);
  q(4, 8, "coin"); q(5, 8, "super"); q(6, 8, "fire"); q(7, 8, "cape"); q(8, 8, "star"); q(9, 8, "oneup"); q(10, 8, "key");
  for (let x = 12; x <= 16; x++) put(x, 8, "B");                   // brick ceiling (big smashes, small rattles)
  for (let x = 18; x <= 21; x++) put(x, 11, "T");                  // turn-block step (spin-breakable)
  for (let x = 24; x <= 30; x++) put(x, 9, "C");                   // coin row
  for (let x = 24; x <= 32; x += 2) put(x, 5, "D");                // five dragon coins
  ground(41, 42); ground(44, 128);                                  // pit at column 43
  put(46, 8, "P");                                                  // P-switch block
  for (let x = 48; x <= 52; x++) put(x, 8, "B");                   // bricks -> coins under P-switch
  for (let x = 48; x <= 52; x++) put(x, 5, "C");                   // coins -> bricks under P-switch
  put(122, 11, "H");                                                // keyhole
  return {
    id: "m4", name: "M4 BLOCK LAB", w, h, tiles, contents, spawn: { x: 2, y: 176 },
    objects: [
      { type: "shell", color: "green", x: 60 * T + 2, y: 11 * T },
      { type: "key", x: 64 * T + 2, y: 11 * T }
    ]
  };
}

// --- Tiles & collision (subpixel fixed-point movement; slopes) -----------------
function tileAt(lv, c, r) { if (c < 0 || c >= lv.w || r < 0) return "G"; if (r >= lv.h) return ""; return lv.tiles.get(c + "," + r) || ""; }
const solid = t => !!t && "GBQXqTpPHF".includes(t);
const isSlope = t => t === "/" || t === "\\";
const isClimbTile = t => t === "V" || t === "N";                    // vine / net
const isWaterTile = t => t === "W";
function rectHit(lv, x, y, w, h, skipSlopes) {
  const c0 = Math.floor(x / T), c1 = Math.floor((x + w - .01) / T), r0 = Math.floor(y / T), r1 = Math.floor((y + h - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const t = tileAt(lv, c, r);
    if (!solid(t) || (skipSlopes && isSlope(t))) continue;
    return { c, r, t };
  }
  return null;
}
// slope surface height (px) under x near footY; null if none
function slopeFloor(lv, x, footY) {
  const c0 = Math.floor((x - 10) / T), c1 = Math.floor((x + 10) / T), r = Math.floor(footY / T);
  let best = null;
  for (let c = c0; c <= c1; c++) {
    for (let rr = r - 2; rr <= r + 1; rr++) {
      const t = tileAt(lv, c, rr);
      if (t !== "/" && t !== "\\") continue;
      const lx = x - c * T;
      if (lx < 0 || lx > T) continue;
      const floor = t === "/" ? (rr + 1) * T - lx : rr * T + lx;
      if (floor < footY - 9 || floor > footY + 9) continue;
      if (!best || Math.abs(footY - floor) < Math.abs(footY - best.floor)) best = { floor, t, rr, downhill: t === "/" ? -1 : 1 };
    }
  }
  return best;
}
function onSlope(lv, x, footY) {
  const s = slopeFloor(lv, x, footY);
  return s && Math.abs(footY - s.floor) <= 9 ? s : null;
}
function moveX(e, dx, lv) {
  if (!dx) return;
  const step = dx > 0 ? 1 : -1; let rem = Math.abs(dx);
  while (rem-- > 0) {
    e.x += step;
    const hit = rectHit(lv, e.x, e.y, e.w, e.h, true); // slopes don't block sideways
    if (hit) {
      if (e.spin && hit.t === "T") { breakBlock(lv, hit.c, hit.r); continue; } // spin jump breaks turn blocks
      e.x = step > 0 ? hit.c * T - e.w : (hit.c + 1) * T; e.vx = 0; return;
    }
  }
}
function moveY(e, dy, lv) {
  if (!dy) return;
  e.onGround = false;
  const step = dy > 0 ? 1 : -1; let rem = Math.abs(dy);
  while (rem-- > 0) {
    e.y += step;
    if (step > 0) {
      const hit = rectHit(lv, e.x + 1, e.y, e.w - 2, e.h, false);
      if (hit) {
        if (e.spin && hit.t === "T") { breakBlock(lv, hit.c, hit.r); e.y = hit.r * T - e.h; e.vy = -48; e.onGround = false; return; } // spin breaks + bounces
        if (isSlope(hit.t)) { const s = slopeFloor(lv, e.x + e.w / 2, e.y + e.h); e.y = (s ? s.floor : hit.r * T) - e.h; }
        else e.y = hit.r * T - e.h;
        e.onGround = true; e.vy = 0; return;
      }
      const s = slopeFloor(lv, e.x + e.w / 2, e.y + e.h);
      if (s) { e.y = s.floor - e.h; e.onGround = true; e.vy = 0; return; }
    } else {
      const hit = rectHit(lv, e.x + 1, e.y, e.w - 2, e.h, false);
      if (hit) {
        if (e.spin && hit.t === "T") { breakBlock(lv, hit.c, hit.r); continue; } // spin jump breaks turn blocks
        e.y = (hit.r + 1) * T; if (!isSlope(hit.t)) hitBlock(lv, hit.c, hit.r, e); e.vy = 0; return;
      }
    }
  }
}
function snapSlope(e, lv) {
  const s = onSlope(lv, e.x + e.w / 2, e.y + e.h);
  if (s) { e.y = s.floor - e.h; e.onGround = true; }
}
function bump(lv, c, r) { lv.bump.set(c + "," + r, BLOCK_BUMP); }

function spawnObject(lv, type, x, y, opts = {}) {
  const o = Object.assign({ type, x, y, w: 12, h: 12, vx: 0, vy: 0, subX: 0, subY: 0,
    onGround: false, facing: 1, state: "idle", heldBy: null, tick: 0, hurtTick: 0, dead: false }, opts);
  game.objects.push(o);
  return o;
}
function spawnDebris(lv, c, r) {
  const v = [[-16, -48], [16, -48], [-12, -64], [12, -64]];
  for (let i = 0; i < 4; i++) spawnObject(lv, "debris", c * T + 5, r * T + 5, { w: 6, h: 6, vx: v[i][0], vy: v[i][1] });
}
function breakBlock(lv, c, r) { const k = c + "," + r; if (lv.tiles.has(k)) lv.tiles.delete(k); spawnDebris(lv, c, r); }

function spawnFromBlock(lv, c, r) {
  const item = (lv.contents && lv.contents.get(c + "," + r)) || "coin";
  const x = c * T + 2, y = r * T - 2;
  if (item === "coin") spawnObject(lv, "coin", x + 2, y, { w: 8, h: 12 });
  else if (item === "super") spawnObject(lv, "powerup", x, y, { power: "super", vx: 8 });
  else if (item === "fire") spawnObject(lv, "powerup", x, y, { power: "fire", vx: 8 });
  else if (item === "cape") spawnObject(lv, "powerup", x, y, { power: "cape", vx: 8, feather: true });
  else if (item === "star") spawnObject(lv, "star", x, y, { vx: 16, vy: -32 });
  else if (item === "oneup") spawnObject(lv, "oneup", x, y, { vx: 8 });
  else if (item === "key") spawnObject(lv, "key", x, y);
  else if (item === "shell") spawnObject(lv, "shell", x, y, { color: "green" });
  else if (item === "pswitch") spawnObject(lv, "pswitch", x, y);
}
// hit a block from below: ? contents / brick break+bump / turn bump / P-switch block
function hitBlock(lv, c, r, e) {
  const k = c + "," + r, t = tileAt(lv, c, r);
  if (t === "Q") { lv.tiles.set(k, "q"); bump(lv, c, r); spawnFromBlock(lv, c, r); }
  else if (t === "B") { if (e.power && e.power !== "small") breakBlock(lv, c, r); else bump(lv, c, r); }
  else if (t === "P") { lv.tiles.set(k, "p"); bump(lv, c, r); spawnObject(lv, "pswitch", c * T + 2, r * T - 2); }
  else bump(lv, c, r);                                             // T / X / q / p just rattle
}
function addCoin() {
  const g = game; g.save.coins++; g.save.score += COIN_SCORE;
  if (g.save.coins >= 100) { g.save.coins -= 100; g.save.lives++; show("100 COINS · 1-UP!"); }
}
function addDragon() {
  if (game.dragon >= DRAGON_TOTAL) return;
  game.dragon++; game.save.score += DRAGON_SCORE;
  if (game.dragon === DRAGON_TOTAL) { game.save.lives++; show("DRAGON COINS · 1-UP!"); }
}
function collectTiles(p, lv) {
  const c0 = Math.floor(p.x / T), c1 = Math.floor((p.x + p.w - .01) / T), r0 = Math.floor(p.y / T), r1 = Math.floor((p.y + p.h - .01) / T);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const k = c + "," + r, t = tileAt(lv, c, r);
    if (t === "C") { lv.tiles.delete(k); addCoin(); }
    else if (t === "D") { lv.tiles.delete(k); addDragon(); }
  }
}
function activatePSwitch() {
  const lv = game.level, swap = [];
  for (const [k, t] of lv.tiles) {
    if (t === "B") { lv.tiles.set(k, "C"); swap.push([k, "B"]); }
    else if (t === "C") { lv.tiles.set(k, "B"); swap.push([k, "C"]); }
  }
  game.pswitch = P_SWITCH_TICKS; game.pswap = swap; show("P-SWITCH!");
}
function revertPSwitch() {
  const lv = game.level;
  for (const [k, orig] of game.pswap || []) {
    const cur = lv.tiles.get(k), swapped = orig === "B" ? "C" : "B";
    if (cur === swapped) lv.tiles.set(k, orig);
  }
  game.pswap = null;
}

// --- M4 object physics -----------------------------------------------------------
function objMoveX(o, lv) {
  if (!o.vx) return;
  const step = o.vx > 0 ? 1 : -1; let rem = Math.abs(o.vx);
  while (rem-- > 0) {
    o.x += step;
    const hit = rectHit(lv, o.x, o.y, o.w, o.h, true);
    if (!hit) continue;
    if (o.type === "shell" && o.state === "kicked" && (hit.t === "B" || hit.t === "T")) { breakBlock(lv, hit.c, hit.r); continue; }
    o.x = step > 0 ? hit.c * T - o.w : (hit.c + 1) * T;
    if (o.type === "shell") {
      if (o.state === "kicked" && Math.abs(o.vx) > SHELL_MIN) o.vx = -Math.sign(o.vx) * (Math.abs(o.vx) / 2);
      else { o.vx = 0; if (o.state === "kicked") o.state = "idle"; }
    } else if (o.type === "powerup" || o.type === "oneup" || o.type === "star") o.vx = -o.vx;
    else o.vx = 0;
    return;
  }
}
function objMoveY(o, lv) {
  if (!o.vy) return;
  o.onGround = false;
  const step = o.vy > 0 ? 1 : -1; let rem = Math.abs(o.vy);
  while (rem-- > 0) {
    o.y += step;
    if (step > 0) {
      const hit = rectHit(lv, o.x + 1, o.y, o.w - 2, o.h, false);
      if (hit) {
        if (o.type === "shell" && o.state === "kicked" && (hit.t === "B" || hit.t === "T")) { breakBlock(lv, hit.c, hit.r); continue; }
        o.y = hit.r * T - o.h;
        const fall = o.vy; o.vy = 0; o.onGround = true;
        if (o.type === "star") { o.vy = -48; o.onGround = false; }
        else if (o.type === "debris") { o.vy = -fall / 2; o.onGround = false; if (Math.abs(o.vy) < 4) { o.vy = 0; o.onGround = true; } }
        return;
      }
    } else {
      const hit = rectHit(lv, o.x + 1, o.y, o.w - 2, o.h, false);
      if (hit) { o.y = (hit.r + 1) * T; o.vy = 0; return; }
    }
  }
}
function updateObjects(lv) {

    if (o.heldBy) { carryObject(o, p, lv); continue; }

}

function secretExit() { if (game.secret) return; game.secret = true; show("SECRET EXIT!"); setMode("clear"); }

// --- Player --------------------------------------------------------------------
function makePlayer(x, y) {
  return { x, y, prevX: x, prevY: y, w: 12, h: 16, vx: 0, vy: 0, subX: 0, subY: 0,
           onGround: false, facing: 1, power: "small", pMeter: 0, crouch: false, sliding: false,
           jumpStartY: 0, airMinY: 0, lastApex: 0, stopMeasuring: false, stopStartX: 0, lastStopDist: 0,
           spin: false, flight: 0, swim: false, climb: null,
           reserve: null, starTick: 0, balloon: false, balloonTick: 0 };
}
function loadLevel(lv) {
  game.level = lv;
  game.player = makePlayer(lv.spawn.x, lv.spawn.y);
  game.objects = []; game.pswitch = 0; game.pswap = null; game.dragon = 0; game.secret = false;
  if (!lv.bump) lv.bump = new Map();
  for (const ob of (lv.objects || [])) spawnObject(lv, ob.type, ob.x, ob.y, ob);
  game.camX = clamp(lv.spawn.x - 112, 0, Math.max(0, lv.w * T - W));
  game.timer = 300;

// --- Update: fixed 60 Hz tick ------------------------------------------------
function update() {
  game.tick++;
  if (game.transition > 0) game.transition--;
  if (game.messageTick > 0) game.messageTick--;
  if (input.hit("F3")) game.debug = !game.debug;
  if (input.hit("F2") && game.mode === "level") cyclePower();
  if (input.hit("F5") && game.mode === "level") grantStar();
  if (input.hit("F6") && game.mode === "level") grantBalloon();
  switch (game.mode) {
    case "title": updateTitle(); break;
    case "map": updateMap(); break;
    case "level": updateLevel(); break;
    case "pause": updatePause(); break;
    case "death": updateDeath(); break;
    case "clear": updateClear(); break;
    case "gameover": updateGameOver(); break;
    case "ending": updateEnding(); break;
  }
  input.edges();
}
function updateTitle() { if (input.hit(...KEY.START, "Space")) loadLevel(makeM4Level()); }
function updateMap() { if (input.hit(...KEY.START, "Space")) loadLevel(makeM4Level()); } // M7: real map
function updateLevel() {
  const p = game.player; if (!p) return;
  if (input.hit(...KEY.START)) { setMode("pause"); return; }
  if (input.hit(...KEY.RESERVE)) useReserve();
  updatePlayer(p);
  updateObjects(game.level);
  updateCarry(p, game.level);
  collectTiles(p, game.level);
  if (game.pswitch > 0) { game.pswitch--; if (game.pswitch === 0 && game.pswap) revertPSwitch(); }
  for (const [k, v] of game.level.bump) { if (v > 1) game.level.bump.set(k, v - 1); else game.level.bump.delete(k); }
  updateCam(p);
  if (game.timer > 0) game.timer--;
  else { game.timer = 0; loseLife(); }
  if (p.y > H + 80) loseLife();
}
function updatePause() {
  if (input.hit(...KEY.START, "Escape", "KeyP")) setMode("level");
  else if (input.hit("KeyQ")) setMode("title");
}
function updateDeath() { if (++game.deathTick > 90) loadLevel(makeTestLevel()); }
function updateClear() { if (++game.deathTick > 90) setMode("title"); }
function updateGameOver() { if (++game.deathTick > 90 && input.hit(...KEY.START, "Space")) setMode("title"); }
function updateEnding() { if (input.hit(...KEY.START, "Space")) setMode("title"); }

function setHeight(p, h) {
  if (h === p.h) return true;
  const bottom = p.y + p.h, ny = bottom - h;
  if (h > p.h && rectHit(game.level, p.x, ny, p.w, h)) return false; // growing into ceiling
  p.y = ny; p.h = h;
  return true;
}
function jumpIndex(p) { return Math.min(14, (Math.abs(p.vx) >> 2) & ~1); }   // DATA_00D2BD index: (|vx|>>2)&$FE
function cyclePower() {
  const p = game.player; if (!p) return;
  const i = POWER_ORDER.indexOf(p.power);
  p.power = POWER_ORDER[(i + 1) % POWER_ORDER.length];
  setHeight(p, p.power === "small" ? 16 : 32);
  p.flight = 0; p.spin = false; p.balloon = false; p.balloonTick = 0;
}
function applyPower(type) {
  const p = game.player; if (!p) return;
  if (type !== "super" && type !== "fire" && type !== "cape") return;
  if (p.power === "small") { p.power = type; setHeight(p, 32); }
  else p.reserve = type;                                            // already powered: item goes to the reserve box
}
function damagePlayer() {

  if (p.starTick > 0) return;                                       // star: invincible
  for (const o of game.objects) if (o.heldBy === p) { o.heldBy = null; o.state = "idle"; o.vx = 0; o.vy = 0; }
  if (p.power !== "small") { p.power = "small"; setHeight(p, 16); p.flight = 0; p.spin = false; }

}
function loseLife() {

  else setMode("death");
}
function useReserve() {

}
function grantStar() { const p = game.player; if (p) p.starTick = STAR_TICKS; }
function grantBalloon() { const p = game.player; if (p) { p.balloon = true; p.balloonTick = BALLOON_TICKS; p.vy = -16; p.flight = 0; } }

function maxSpeed(p, run, sl) {

// --- M3 physics helpers --------------------------------------------------------
function waterAt(lv, p) {

function climbAt(lv, x, y, h) {

}

function updatePlayer(p) {
  const lv = game.level;
  p.prevX = p.x; p.prevY = p.y;

  // transient timers

  if (p.balloon) { p.balloonTick--; if (p.balloonTick <= 0) { p.balloon = false; p.balloonTick = 0; } }

  // power hitbox (feet-anchored): small 16, big 32, crouch 16
  const baseH = p.power === "small" ? 16 : 32;

  p.crouch = input.held(...KEY.DOWN) && p.onGround && p.power !== "small" && !p.climb && !inWater;
  setHeight(p, p.crouch ? 16 : baseH);

  const dir = (input.held(...KEY.RIGHT) ? 1 : 0) - (input.held(...KEY.LEFT) ? 1 : 0);
  const run = input.held(...KEY.RUN);
  if (dir) p.facing = dir;

  const here = climbAt(lv, p.x + p.w / 2, p.y, p.h);

  p.subX += p.vx; const dx = Math.floor(p.subX / SUB); p.subX -= dx * SUB;
  p.subY += p.vy; const dy = Math.floor(p.subY / SUB); p.subY -= dy * SUB;

  moveY(p, dy, lv);

function updateClimb(p, lv, dir) {

    p.climb = null;

  if (jump) p.vy = SWIM_STROKE;                                    // swim stroke

function updateBalloon(p, dir) {

function updateLandAir(p, lv, dir, run) {

// --- Render -------------------------------------------------------------------
function text(s, x, y, color = "#fff", align = "left", px = 8) {

}

    case "gameover": drawGameOver(); break;
    case "ending": drawEnding(); break;

  if (game.mode === "pause") drawPause();
  if (game.mode === "death") drawDeath();
  if (game.mode === "clear") drawClear();
  if (game.transition > 0) { ctx.fillStyle = `rgba(0,0,0,${game.transition / 24})`; ctx.fillRect(0, 0, W, H); }
}
function drawTitle() {
  ctx.fillStyle = "#0b6cc0"; ctx.fillRect(0, 0, W, H);
  text("SUPER MARIO WORLD", 128, 48, "#fff6a8", "center", 12);
  text("M3 MOVES · FLIGHT · SWIM · CLIMB", 128, 74, "#ffcf58", "center", 8);
  text("PRESS ENTER TO START", 128, 116, "#fff", "center", 8);
  text("ARROWS MOVE · X/Y RUN · B JUMP · A SPIN", 128, 140, "#bdb5d0", "center", 7);
  text("F2 POWER · F5 STAR · F6 BALLOON · SHIFT RESERVE", 128, 158, "#8fd6a8", "center", 7);

function drawMapStub() { ctx.fillStyle = "#66b8e6"; ctx.fillRect(0, 0, W, H); text("MAP (M7)", 128, 104, "#fff", "center", 10); }
function drawLevel() {
  const lv = game.level, p = game.player, cam = game.camX;
  ctx.fillStyle = "#6db3e8"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-Math.floor(cam), 0);
  const c0 = Math.max(0, Math.floor(cam / T) - 1), c1 = Math.min(lv.w - 1, Math.ceil((cam + W) / T) + 1);
  for (let r = 0; r < lv.h; r++) for (let c = c0; c <= c1; c++) { const t = tileAt(lv, c, r); if (t) drawTile(t, c * T, r * T, c, r); }
  if (p) drawMario(p, cam);
  ctx.restore();
  drawHud();
  if (game.debug) drawDebug();
  if (game.messageTick > 0) drawMessage();
}
function drawTile(t, x, y, c, r) {
  if (t === "G") {
    const top = !solid(tileAt(game.level, c, r - 1));
    ctx.fillStyle = "#c98d52"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#a9733c"; ctx.fillRect(x + 4, y + 9, 3, 2); ctx.fillRect(x + 11, y + 6, 2, 2); ctx.fillRect(x + 7, y + 13, 2, 2);
    if (top) { ctx.fillStyle = "#176d24"; ctx.fillRect(x, y, T, 6); ctx.fillStyle = "#45c248"; ctx.fillRect(x, y, T, 3); }
  } else if (t === "F") {
    ctx.fillStyle = "#b8b8c8"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#8e8ea8"; ctx.fillRect(x, y, T, 2);
  } else if (t === "B") {
    ctx.fillStyle = "#8a5a3c"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#c98d52"; ctx.fillRect(x + 1, y + 1, 14, 14); ctx.fillStyle = "#8a5a3c"; ctx.fillRect(x + 1, y + 7, 14, 2);
  } else if (t === "X") {
    ctx.fillStyle = "#5f6165"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#989b9b"; ctx.fillRect(x + 1, y + 1, 14, 14);
  } else if (t === "Q") {
    ctx.fillStyle = "#b3541e"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#f3ad32"; ctx.fillRect(x + 1, y + 1, 14, 14); ctx.fillStyle = "#fff2a8"; ctx.fillRect(x + 5, y + 4, 6, 8); ctx.fillRect(x + 3, y + 6, 10, 3);
  } else if (t === "T") {
    ctx.fillStyle = "#b3541e"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#f3ad32"; ctx.fillRect(x + 1, y + 1, 14, 14); ctx.fillStyle = "#fff2a8"; ctx.beginPath(); ctx.moveTo(x + 5, y + 5); ctx.lineTo(x + 11, y + 8); ctx.lineTo(x + 5, y + 11); ctx.closePath(); ctx.fill();
  } else if (t === "/" || t === "\\") {
    ctx.fillStyle = "#c98d52"; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = "#45c248"; ctx.beginPath();
    if (t === "/") { ctx.moveTo(x, y + T); ctx.lineTo(x + T, y + T); ctx.lineTo(x + T, y); }
    else { ctx.moveTo(x, y); ctx.lineTo(x + T, y + T); ctx.lineTo(x, y + T); }
    ctx.closePath(); ctx.fill();
  } else if (t === "W") {
    ctx.fillStyle = "#1858b8"; ctx.fillRect(x, y, T, T);
    if (tileAt(game.level, c, r - 1) !== "W") { const sh = (game.tick >> 3) & 1; ctx.fillStyle = "#7fd4f8"; ctx.fillRect(x, y + sh, T, 3); }
  } else if (t === "V") {
    ctx.fillStyle = "#1a5a1a"; ctx.fillRect(x + 7, y, 2, T);
    ctx.fillStyle = "#3a9a3a"; ctx.fillRect(x + 7, y + ((r * 3 + game.tick) % 4) * 3, 6, 2);
  } else if (t === "N") {
    ctx.fillStyle = "#6a6a7a"; ctx.fillRect(x, y, T, T); ctx.fillStyle = "#3a3a4a";
    for (let i = 0; i < 4; i++) { ctx.fillRect(x + i * 4 + 1, y, 1, T); ctx.fillRect(x, y + i * 4 + 1, T, 1); }
  }
}
function drawMario(p, cam) {
  const x = Math.floor(p.x - cam), y = Math.floor(p.y), f = p.facing;
  ctx.save();
  if (f < 0) { ctx.translate(x + p.w, y); ctx.scale(-1, 1); } else ctx.translate(x, y);
  if (p.spin) { ctx.translate(6, p.h / 2); ctx.rotate((game.tick % 20) / 20 * Math.PI * 2); ctx.translate(-6, -p.h / 2); } // spin tumble
  const big = p.h > 16, step = p.onGround && Math.abs(p.vx) > 3 ? Math.floor(game.tick / 4) % 2 : 0;
  const fire = p.power === "fire", star = p.starTick > 0;
  const flash = star && (Math.floor(game.tick / 2) % 2 === 0);
  const HAT = flash ? "#f8d060" : fire ? "#f8f8f8" : "#e83b3f";
  const SHIRT = fire ? "#f8f8f8" : "#f0aa67";
  const OVER = flash ? "#2854ad" : fire ? "#e83b3f" : "#2854ad";
  if (p.power === "cape") { ctx.fillStyle = "#f8d060"; ctx.fillRect(-2, 6, 5, 12); ctx.fillStyle = "#e8a020"; ctx.fillRect(-2, 6, 2, 12); } // cape
  if (p.balloon) { ctx.fillStyle = "#e83b3f"; ctx.beginPath(); ctx.arc(6, -8, 6, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.fillStyle = "#fff"; ctx.fillRect(5, -14, 2, 8); } // P-balloon
  if (p.crouch) {
    ctx.fillStyle = HAT; ctx.fillRect(1, 0, 10, 4); ctx.fillRect(0, 3, 13, 3);
    ctx.fillStyle = "#f0aa67"; ctx.fillRect(4, 6, 8, 7);
    ctx.fillStyle = "#241e24"; ctx.fillRect(9, 8, 2, 2);
    ctx.fillStyle = OVER; ctx.fillRect(1, 13, 10, 3);
  } else if (big) {
    ctx.fillStyle = HAT; ctx.fillRect(0, 0, 12, 4); ctx.fillRect(-1, 4, 14, 3);
    ctx.fillStyle = "#6f3828"; ctx.fillRect(1, 7, 4, 8);
    ctx.fillStyle = SHIRT; ctx.fillRect(5, 7, 7, 8); ctx.fillRect(11, 9, 2, 3);
    ctx.fillStyle = "#241e24"; ctx.fillRect(9, 9, 2, 2);
    ctx.fillStyle = OVER; ctx.fillRect(1, 15, 10, 6); ctx.fillRect(0, 18, 12, 5);
    ctx.fillStyle = "#f8f3df"; ctx.fillRect(-1, 21, 4, 5);
    ctx.fillStyle = "#2854ad"; ctx.fillRect(2, 21, 9, 7); ctx.fillRect(1, 26, 4, 4); ctx.fillRect(8, 26, 4, 4);
    ctx.fillStyle = "#f4cc3f"; ctx.fillRect(3, 22, 2, 2); ctx.fillRect(8, 22, 2, 2);
    ctx.fillStyle = "#633328"; ctx.fillRect(step ? 0 : 1, 30, 6, 3); ctx.fillRect(step ? 8 : 7, 30, 6, 3);
  } else {
    ctx.fillStyle = HAT; ctx.fillRect(1, 0, 9, 3); ctx.fillRect(0, 3, 13, 2);
    ctx.fillStyle = "#6f3828"; ctx.fillRect(1, 5, 4, 5);
    ctx.fillStyle = SHIRT; ctx.fillRect(5, 5, 8, 5); ctx.fillRect(11, 7, 3, 2);
    ctx.fillStyle = "#241e24"; ctx.fillRect(9, 6, 2, 2);
    ctx.fillStyle = OVER; ctx.fillRect(2, 10, 9, 3);
    ctx.fillStyle = "#2854ad"; ctx.fillRect(1, 12, 11, 3);
    ctx.fillStyle = "#633328"; ctx.fillRect(step ? 0 : 1, 14, 5, 2); ctx.fillRect(step ? 8 : 7, 14, 6, 2);
  }
  ctx.restore();
}
function drawHud() {
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, W, 18);
  // lives: Mario head + count
  ctx.fillStyle = "#e83b3f"; ctx.fillRect(6, 4, 7, 4); ctx.fillStyle = "#f0aa67"; ctx.fillRect(8, 7, 3, 4); ctx.fillStyle = "#2854ad"; ctx.fillRect(6, 11, 7, 3);
  text("x" + String(game.save.lives).padStart(2, "0"), 15, 4, "#fff");
  // coins: coin icon + count
  ctx.fillStyle = "#f2c52c"; ctx.beginPath(); ctx.arc(66, 10, 4, 0, 7); ctx.fill(); ctx.fillStyle = "#b07a10"; ctx.fillRect(64, 8, 4, 4);
  text("x" + String(game.save.coins).padStart(2, "0"), 73, 4, "#fff");
  // reserve box (top center)
  drawReserve(116, 1);
  // time (top right) + score (bottom right)
  text("TIME", 198, 4, "#fff"); text(String(game.timer).padStart(3, "0"), 252, 4, "#fff", "right");
  text(String(game.save.score).padStart(7, "0"), 252, 12, "#fff", "right");
}
function drawReserve(x, y) {
  ctx.fillStyle = "#23233a"; ctx.fillRect(x, y, 16, 16); ctx.strokeStyle = "#8f8fb0"; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, 15, 15);
  const it = game.player && game.player.reserve;
  if (it === "super") { ctx.fillStyle = "#e83b3f"; ctx.fillRect(x + 4, y + 3, 8, 10); ctx.fillStyle = "#f8f8f8"; ctx.fillRect(x + 4, y + 3, 8, 4); }
  else if (it === "fire") { ctx.fillStyle = "#e85a3f"; ctx.fillRect(x + 4, y + 5, 8, 8); ctx.fillStyle = "#f8d060"; ctx.fillRect(x + 4, y + 3, 8, 3); }
  else if (it === "cape") { ctx.fillStyle = "#f8d060"; ctx.fillRect(x + 3, y + 3, 10, 6); ctx.fillStyle = "#e83b3f"; ctx.fillRect(x + 6, y + 5, 4, 4); }
}
function drawDebug() {
  const p = game.player; if (!p) return;
  const phase = p.climb ? "CLIMB" : p.swim ? "SWIM" : p.flight ? ["", "FLY-UP", "GLIDE", "DIVE", "PULL"][p.flight] : !p.onGround ? "AIR" : p.pMeter >= P_MAX ? "SPRINT" : Math.abs(p.vx) > WALK_MAX ? "RUN" : "WALK";
  const lines = [
    game.mode + " tick " + game.tick + "  " + phase,
    "x " + p.x.toFixed(2) + " y " + p.y.toFixed(2) + " h " + p.h,
    "vx " + p.vx + "  vy " + p.vy + " subpx/f",
    "sub " + Math.round((p.x - Math.floor(p.x)) * 16) + "/16  P " + p.pMeter + "/112",
    "ground " + (+p.onGround) + " slide " + (+p.sliding) + " crouch " + (+p.crouch),
    "spin " + (+p.spin) + " swim " + (+p.swim) + " climb " + (p.climb ? p.climb.type : "-"),
    "power " + p.power + " reserve " + (p.reserve || "-") + " star " + p.starTick + " bal " + (+p.balloon),
    "apex " + p.lastApex.toFixed(1) + "px  stop " + p.lastStopDist.toFixed(1) + "px"
  ];
  ctx.fillStyle = "rgba(10,10,20,0.82)"; ctx.fillRect(4, 20, 190, lines.length * 9 + 6);
  lines.forEach((s, i) => text(s, 8, 23 + i * 9, "#7ff7b0", "left", 8));
}
function drawMessage() { text(game.message, 128, 34, "#fff4b0", "center", 8); }
function drawPause() { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H); text("PAUSED", 128, 96, "#ffe06b", "center", 13); text("ENTER: RESUME · Q: QUIT", 128, 128, "#d8d0eb", "center", 8); }
function drawDeath() { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H); text("COURSE MISS", 128, 104, "#ffb2a8", "center", 10); }
function drawClear() { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, W, H); text("COURSE CLEAR!", 128, 104, "#ffe36b", "center", 11); }
function drawGameOver() { ctx.fillStyle = "#131020"; ctx.fillRect(0, 0, W, H); text("GAME OVER", 128, 96, "#ee6c68", "center", 16); }
function drawEnding() { ctx.fillStyle = "#38276d"; ctx.fillRect(0, 0, W, H); text("THE END", 128, 104, "#fff1a0", "center", 14); }

// --- Fixed 60 Hz loop (bounded catch-up; render interpolates later) -----------
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
  requestAnimationFrame(frame);
}

// --- Debug / test API ----------------------------------------------------------
window.__SMW = {
  snapshot() {
    return {
      mode: game.mode, tick: game.tick, level: game.level && game.level.id,
      player: game.player && { x: game.player.x, y: game.player.y, vx: game.player.vx, vy: game.player.vy,
                               subX: game.player.subX, subY: game.player.subY, pMeter: game.player.pMeter,
                               power: game.player.power, h: game.player.h, onGround: game.player.onGround,
                               crouch: game.player.crouch, sliding: game.player.sliding,
                               spin: game.player.spin, flight: game.player.flight, swim: game.player.swim,
                               climb: game.player.climb && game.player.climb.type, reserve: game.player.reserve,
                               starTick: game.player.starTick, balloon: game.player.balloon },
      save: JSON.parse(JSON.stringify(game.save))
    };
  },
  loadLevel(id = "test") { if (id === "test") loadLevel(makeTestLevel()); else if (id === "m3") loadLevel(makeM3Level()); return window.__SMW.snapshot(); },
  advanceTicks(n) { for (let i = 0; i < Math.max(0, Math.min(36000, n | 0)); i++) update(); render(); return window.__SMW.snapshot(); },
  setDebug(v) { game.debug = !!v; },
  resetSave() { game.save = freshSave(); store(); },
  reset() { game.tick = 0; game.transition = 0; game.message = ""; game.messageTick = 0; input.reset(); loadLevel(makeTestLevel()); },
  hold(...codes) { codes.forEach(c => input.down.add(c)); },
  press(...codes) { codes.forEach(c => { input.down.add(c); input.pressed.add(c); }); },
  releaseAll() { input.down.clear(); },
  setPos(x, y) { const p = game.player; if (p) { p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.climb = null; } return window.__SMW.snapshot(); },
  getTile(c, r) { return game.level ? tileAt(game.level, c, r) : null; },
  setPower(t) { const p = game.player; if (p) { p.power = t; p.reserve = null; setHeight(p, t === "small" ? 16 : 32); } return window.__SMW.snapshot(); },
  applyPower(t) { applyPower(t); return window.__SMW.snapshot(); },
  damage() { damagePlayer(); return window.__SMW.snapshot(); },
  useReserve() { useReserve(); return window.__SMW.snapshot(); },
  grantStar() { grantStar(); return window.__SMW.snapshot(); },
  grantBalloon() { grantBalloon(); return window.__SMW.snapshot(); },
  reseed,
  measure() {
    const step = n => { for (let i = 0; i < n; i++) update(); };
    const settle = () => step(3);
    const osc = (n = 20) => { let mn = 1e9, mx = -1e9; for (let i = 0; i < n; i++) { update(); mn = Math.min(mn, game.player.vx); mx = Math.max(mx, game.player.vx); } return [mn, mx]; };
    const land = startY => { let minY = game.player.y; for (let i = 0; i < 120 && !game.player.onGround; i++) { update(); minY = Math.min(minY, game.player.y); } return +(startY - minY).toFixed(1); };
    const out = {};
    this.reset(); settle(); this.hold("ArrowRight"); step(120); out.walkSpeed = game.player.vx; this.releaseAll();
    this.reset(); settle(); this.hold("ArrowRight", "KeyX"); step(30); out.runOsc = osc(20); this.releaseAll();
    this.reset(); settle(); this.hold("ArrowRight", "KeyX"); step(80); out.sprintOsc = osc(20); out.sprintP = game.player.pMeter; this.releaseAll();
    this.reset(); settle(); this.hold("ArrowRight", "KeyX"); step(80); this.releaseAll();
    let sx = game.player.x, i = 0; while (game.player.vx !== 0 && i < 240) { update(); i++; }
    out.stopDistance = +Math.abs(game.player.x - sx).toFixed(1);
    this.reset(); settle(); this.hold("ArrowRight", "KeyX"); step(80); this.releaseAll(); this.hold("ArrowLeft");
    let rx = game.player.x, j = 0; while (game.player.vx > 0 && j < 240) { update(); j++; }
    out.skidDistance = +Math.abs(game.player.x - rx).toFixed(1); this.releaseAll();
    this.reset(); settle(); let y0 = game.player.y; this.hold("KeyB"); this.press("KeyB"); step(1); out.fullJumpApex = land(y0); this.releaseAll();
    this.reset(); settle(); y0 = game.player.y; this.press("KeyB"); step(1); this.releaseAll(); out.shortHopApex = land(y0);
    this.reset(); settle(); y0 = game.player.y; this.press("KeyA"); step(1); this.releaseAll(); out.spinJumpApex = land(y0);
    this.reset();
    return out;
  },
  keys: input
};

setMode("title");
requestAnimationFrame(frame);
</script></body></html>
